version: "1.0.0"
description: "知识库工程学体检指标注册表：定义单一来源，模块只引用，不复制。"
metrics:
  - id: "file_score"
    name: "文件级健康度"
    unit: "grade"
    scope: "全库"
    method: "frontmatter + 断链 + 标签 + 同步冲突"
    required_fields: ["value", "status", "timestamp", "scope", "method"]
  - id: "content_score"
    name: "内容级健康度"
    unit: "grade"
    scope: "全库"
    method: "七性 + 占位 + 重复 + 孤岛 + 种子 + 空壳"
    required_fields: ["value", "status", "timestamp", "scope", "method"]
  - id: "context_seven"
    name: "上下文七性"
    unit: "score/7"
    scope: "抽样"
    method: "原子性/显式关系/可溯源/时效/紧凑/隔离/可寻址"
    required_fields: ["value", "sample", "dimensions", "timestamp", "scope"]
  - id: "broken_links"
    name: "断链"
    unit: "targets/references"
    scope: "全库或断链来源"
    method: "目标数 / 引用数双报"
    required_fields: ["targets", "references", "status", "timestamp", "scope", "method"]
  - id: "orphans"
    name: "孤岛"
    unit: "notes"
    scope: "全库"
    method: "无入链；必须带构成"
    required_fields: ["value", "composition", "status", "timestamp", "scope"]
  - id: "placeholders"
    name: "占位符"
    unit: "occurrences"
    scope: "全库"
    method: "模板 blocker + 内容债分列"
    required_fields: ["blocker", "content_debt", "status", "timestamp", "scope"]
  - id: "seeds"
    name: "种子"
    unit: "notes"
    scope: "全库"
    method: "启发式 / FM 标记双口径"
    required_fields: ["heuristic", "frontmatter", "overdue", "status", "timestamp"]
  - id: "index_counts"
    name: "索引计数"
    unit: "difference"
    scope: "索引页"
    method: "声明数 − 实测数"
    required_fields: ["declared", "actual", "diff", "status", "timestamp"]

thresholds:
  broken_links: "0 targets / 0 references（建议）"
  high_frequency_links: ">=4 次清零（建议）"
  orphan_core_domain: "<=1%（建议）"
  placeholders_blocker: "0 或全部挂起（建议）"
  seeds_overdue: "0（建议）"
  index_count_diff: "0 或已注明口径（建议）"

rule: "任何模块不得自行修改本文件；版本升级须跑 tests/run_tests.py。"
